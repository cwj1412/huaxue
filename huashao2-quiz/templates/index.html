<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>花儿与少年 2 - 性格测试</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🌸 花儿与少年 2 🌸</h1>
            <p class="subtitle">测测你是节目里的谁？</p>
        </header>

        <main class="intro-section">
            <div class="intro-card">
                <h2>经典重现 · 名场面测试</h2>
                <p>基于《花儿与少年 2》七大经典场景，通过你的行为选择，还原你在团队中的真实角色。</p>
                
                <div class="features">
                    <div class="feature-item">
                        <span class="icon">🚌</span>
                        <span>房车座位争夺</span>
                    </div>
                    <div class="feature-item">
                        <span class="icon">⏱️</span>
                        <span>尴尬九分钟</span>
                    </div>
                    <div class="feature-item">
                        <span class="icon">💰</span>
                        <span>经费危机</span>
                    </div>
                    <div class="feature-item">
                        <span class="icon">😤</span>
                        <span>意见不合</span>
                    </div>
                </div>

                <div class="characters-preview">
                    <h3>七大角色等待解锁</h3>
                    <div class="character-tags">
                        <span class="tag" style="background: #8B0000;">宁静</span>
                        <span class="tag" style="background: #FF69B4;">许晴</span>
                        <span class="tag" style="background: #DDA0DD;">郑爽</span>
                        <span class="tag" style="background: #4682B4;">毛阿敏</span>
                        <span class="tag" style="background: #20B2AA;">井柏然</span>
                        <span class="tag" style="background: #708090;">杨洋</span>
                        <span class="tag" style="background: #FFD700;">陈意涵</span>
                    </div>
                </div>

                <a href="/quiz" class="start-btn">开始测试 →</a>
            </div>
        </main>

        <footer class="footer">
            <p>共 10 道题目 | 预计耗时 3 分钟</p>
        </footer>
    </div>
</body>
</html>
